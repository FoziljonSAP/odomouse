<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; connect-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>Odomouse</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="pop">
    <header class="pop-head">
      <div>
        <h1 data-i18n="today">Bugun</h1>
        <p id="date" class="muted"></p>
      </div>
      <div class="head-tools">
        <button class="icon-btn" id="theme" aria-label="Rejimni almashtirish" data-i18n-aria="switchTheme"></button>
        <button class="icon-btn" id="open-settings" title="Sozlamalar" aria-label="Sozlamalar" data-i18n-title="settings" data-i18n-aria="settings">
          <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M3 5h8M15.5 5H17M3 10h1.5M8.5 10H17M3 15h9M16 15h1"/><circle cx="13.2" cy="5" r="2"/><circle cx="6.5" cy="10" r="2"/><circle cx="14" cy="15" r="2"/></svg>
        </button>
      </div>
    </header>

    <section class="guide" id="guide" hidden aria-labelledby="guide-title">
      <h2 id="guide-title" data-i18n="gettingStarted">Boshlash</h2>
      <ol id="guide-steps"></ol>
      <button class="link-btn" id="guide-close" data-i18n="close">Yopish</button>
    </section>

    <div id="notices" class="notices"></div>

    <section class="hero">
      <div class="hero-label">
        <p class="label" data-i18n="distance">Masofa</p>
        <span id="dist-d" class="delta"></span>
      </div>
      <div id="odo"></div>
      <p id="dist-cmp" class="cmp"></p>
    </section>

    <section class="tiles">
      <div class="tile">
        <p class="label" data-i18n="keyboard">Klaviatura</p>
        <p class="value num" id="keys">0</p>
        <p class="sub delta" id="keys-d"></p>
      </div>
      <div class="tile">
        <p class="label" data-i18n="clicks">Kliklar</p>
        <p class="value num" id="clicks">0</p>
        <p class="sub delta" id="clicks-d"></p>
      </div>
      <div class="tile">
        <p class="label" data-i18n="scroll">Scroll</p>
        <p class="value num" id="scroll">0</p>
        <p class="sub delta" id="scroll-d"></p>
      </div>
      <div class="tile">
        <p class="label" data-i18n="activeTime">Faol vaqt</p>
        <p class="value" id="active"></p>
        <p class="sub delta" id="active-d"></p>
      </div>
    </section>

    <section class="typing extra" id="typing"></section>

    <section class="session extra" id="session" hidden>
      <p id="session-text"></p>
      <div class="session-meter" aria-hidden="true"><i id="session-bar"></i></div>
    </section>

    <section class="letters extra">
      <p class="label" data-i18n="topLetters">Top harflar</p>
      <div id="letters" class="keycaps"></div>
    </section>

    <footer class="pop-foot">
      <button class="btn primary" id="open-dash" data-i18n="stats">Statistika</button>
      <button class="btn" id="quit" data-i18n="quit">Chiqish</button>
    </footer>
  </main>

  <script src="native-bridge.js"></script>
  <script src="../core/units.js"></script>
  <script src="../core/keyboard.js"></script>
  <script src="i18n.js"></script>
  <script src="common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
