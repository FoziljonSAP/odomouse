<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; connect-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:">
  <title>Odomouse</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <div class="drag-strip"></div>
  <div class="app">
    <nav class="side" aria-label="Bo'limlar" data-i18n-aria="sections">
      <div class="brand">
        <img src="../assets/trayTemplate@2x.png" alt="" class="brand-icon">
        <span>Odomouse</span>
      </div>
      <button class="nav-item" data-tab="stats">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 16V9M10 16V4M16 16v-5"/></svg><span data-i18n="stats">Statistika</span>
      </button>
      <button class="nav-item" data-tab="settings">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h8M15.5 5H17M3 10h1.5M8.5 10H17M3 15h9M16 15h1"/><circle cx="13.2" cy="5" r="2"/><circle cx="6.5" cy="10" r="2"/><circle cx="14" cy="15" r="2"/></svg><span data-i18n="settings">Sozlamalar</span>
      </button>
      <div class="side-foot">
        <button class="btn primary wide" id="open-wrapped" data-i18n="wrappedCard">Wrapped karta</button>
      </div>
    </nav>

    <main class="content">
      <section class="tab" id="tab-stats" hidden>
        <header class="page-head">
          <div>
            <h1 data-i18n="stats">Statistika</h1>
            <p class="sub" id="range-dates"></p>
          </div>
          <div class="segmented" id="range" role="group" aria-label="Davr" data-i18n-aria="period">
            <button data-range="today" data-i18n="today">Bugun</button>
            <button data-range="7d" data-i18n="days7">7 kun</button>
            <button data-range="30d" data-i18n="days30">30 kun</button>
            <button data-range="all" data-i18n="all">Hammasi</button>
          </div>
        </header>

        <div id="stats-notices" class="notices"></div>

        <section class="hero-band">
          <div>
            <p class="label" data-i18n="distance">Masofa</p>
            <div id="dash-odo"></div>
            <p class="hero-delta" id="hero-delta"></p>
          </div>
          <ul class="fun-list" id="fun-list"></ul>
        </section>

        <section class="kpis" id="kpis"></section>

        <section class="card">
          <header class="card-head">
            <h2 id="trend-title">Kunlar</h2>
            <div class="card-tools">
              <div class="segmented small" id="metric" role="group" aria-label="Ko'rsatkich" data-i18n-aria="metric">
                <button data-metric="mouseMeters" data-i18n="distance">Masofa</button>
                <button data-metric="keystrokes" data-i18n="keyboard">Klaviatura</button>
                <button data-metric="clicks" data-i18n="clicks">Kliklar</button>
                <button data-metric="activeMinutes" data-i18n="activeTime">Faol vaqt</button>
              </div>
              <button class="link-btn" id="toggle-table">Jadval</button>
            </div>
          </header>
          <div id="trend-chart" class="chart-host"></div>
          <div id="trend-table" class="table-wrap" hidden></div>
        </section>

        <section class="card">
          <header class="card-head"><h2 data-i18n="keyboard">Klaviatura</h2></header>
          <div id="keyboard"></div>
        </section>

        <div class="two-col">
          <section class="card">
            <header class="card-head">
              <h2 data-i18n="shortcuts">Yorliqlar</h2>
              <span class="sub" id="shortcuts-sub"></span>
            </header>
            <div id="shortcuts"></div>
          </section>
          <section class="card">
            <header class="card-head"><h2 data-i18n="apps">Ilovalar</h2></header>
            <div id="apps"></div>
          </section>
        </div>

        <div class="two-col">
          <section class="card">
            <header class="card-head"><h2 data-i18n="cursorMap">Kursor joyi</h2></header>
            <div id="cursor-map"></div>
          </section>
          <section class="card">
            <header class="card-head"><h2 id="side-title">Soatlar</h2></header>
            <div id="side-chart" class="chart-host"></div>
          </section>
        </div>
      </section>

      <section class="tab" id="tab-settings" hidden>
        <header class="page-head"><div><h1 data-i18n="settings">Sozlamalar</h1></div></header>
        <div id="settings"></div>
      </section>
    </main>
  </div>

  <dialog id="wrapped" class="wrapped-dialog" aria-labelledby="wrapped-title">
    <div class="wrapped-layout">
      <canvas id="wrapped-canvas" width="1080" height="1350"></canvas>
      <div class="wrapped-side">
        <h2 id="wrapped-title" data-i18n="wrappedCard">Wrapped karta</h2>
        <div class="segmented" id="wrapped-period" role="group" aria-label="Davr" data-i18n-aria="period">
          <button data-period="week" data-i18n="week">Hafta</button>
          <button data-period="month" data-i18n="month">Oy</button>
          <button data-period="all" data-i18n="allTime">Hammasi</button>
        </div>
        <div class="wrapped-actions">
          <button class="btn primary" id="wrapped-save" data-i18n="savePng">PNG saqlash</button>
          <button class="btn" id="wrapped-copy" data-i18n="copy">Nusxa olish</button>
        </div>
        <p class="status" id="wrapped-status" role="status"></p>
        <button class="btn close" id="wrapped-close" data-i18n="close">Yopish</button>
      </div>
    </div>
  </dialog>

  <script src="native-bridge.js"></script>
  <script src="../core/units.js"></script>
  <script src="../core/keyboard.js"></script>
  <script src="../core/shortcuts.js"></script>
  <script src="../core/fun.js"></script>
  <script src="i18n.js"></script>
  <script src="common.js"></script>
  <script src="charts.js"></script>
  <script src="wrapped.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
