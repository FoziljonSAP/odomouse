<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Odomouse</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 24px;
      background: #16181d; color: #f2f1ec; font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Ubuntu, sans-serif;
    }
    img { width: 96px; height: 96px; }
    h1 { font-size: 30px; margin: 18px 0 6px; letter-spacing: -0.02em; }
    p { color: #a9acb3; margin: 0 0 24px; }
    a { display: inline-block; padding: 14px 26px; border-radius: 999px; background: #f2f1ec; color: #16181d; font-weight: 650; text-decoration: none; }
    .road { width: 220px; height: 6px; margin: 28px auto 0; background: repeating-linear-gradient(90deg, #82abe6 0 22px, transparent 22px 36px); opacity: .6; }
  </style>
</head>
<body>
  <!-- any wrong address on the site lands here and goes on to the home page -->
  <main>
    <img id="icon" alt="">
    <h1 id="h">This page is not here</h1>
    <p id="p">Taking you to the Odomouse home page…</p>
    <a id="home" href="/">Odomouse</a>
    <div class="road"></div>
  </main>
  <script>
    (function () {
      // the site lives under /odomouse/ on github.io, at / on its own domain
      var base = location.pathname.indexOf('/odomouse/') === 0 || location.pathname === '/odomouse' ? '/odomouse/' : '/';
      var T = {
        uz: ["Bu sahifa yo'q", "Odomouse bosh sahifasiga o'tyapsiz…", 'Bosh sahifa'],
        ru: ['Такой страницы нет', 'Переходим на главную страницу Odomouse…', 'На главную'],
        en: ['This page is not here', 'Taking you to the Odomouse home page…', 'Home page'],
      };
      var lang = 'en';
      try { lang = localStorage.getItem('lang') || ''; } catch (e) { lang = ''; }
      if (!T[lang]) lang = (navigator.language || 'en').slice(0, 2).toLowerCase();
      if (!T[lang]) lang = 'en';
      document.documentElement.lang = lang;
      document.getElementById('h').textContent = T[lang][0];
      document.getElementById('p').textContent = T[lang][1];
      var home = document.getElementById('home');
      home.textContent = T[lang][2];
      home.href = base;
      document.getElementById('icon').src = base + 'img/icon-256.png';
      setTimeout(function () { location.replace(base); }, 2500);
    })();
  </script>
</body>
</html>
